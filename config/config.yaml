# =============================================
# 虚拟货币量化交易系统配置文件
# =============================================

exchange:
  name: okx
  api_key: ""
  api_secret: ""
  passphrase: ""
  sandbox: false      # true=模拟盘, false=正式交易
  timeout: 30000
  market_type: swap  # swap=永续合约, spot=现货

trading:
  symbols:           # 永续合约交易对（OKX 格式：BTC/USDT:USDT）
    - BTC/USDT:USDT  # 流动性最好，5年4年盈利
    - LINK/USDT:USDT # 5年5年盈利，最稳健
    - BCH/USDT:USDT  # 4/5年盈利，分散用
  timeframe: 4h      # 时间周期: 1m 5m 15m 1h 4h 1d
  base_currency: USDT
  leverage: 3             # 基础杠杆（正常情况）
  leverage_max: 5         # ADX 斜率触发时的高杠杆
  adx_slope_thresh: 3.0   # ADX 3 根 K 线变化 > 此值视为趋势启动
  adx_min: 15.0           # ADX 绝对值低于此值不触发（排除低位噪音）
  margin_mode: isolated   # isolated=逐仓, cross=全仓

risk:
  max_position_pct: 0.2      # 单笔最大仓位占总资金比例 (20%)
  max_total_position_pct: 0.8 # 总仓位上限 (80%)
  stop_loss_pct: 0.03         # 止损比例 (3%)
  take_profit_pct: 0.06       # 止盈比例 (6%)
  max_drawdown_pct: 0.15      # 最大回撤熔断 (15%)
  risk_per_trade_pct: 0.01    # 单笔风险占总资金 (1%)
  cooldown_bars: 100          # 熔断后冷却K线数（4h×100=约17天后重启）
  # ATR 动态止损（根据波动率自适应，替代固定止损）
  use_atr_stop: true
  atr_stop_mult: 3.0          # 止损距离 = ATR × 3.0（配合盘中 high/low 止损检查）
  # 移动止盈（布林带策略不适用，关闭）
  use_trailing_stop: false
  trailing_activation_pct: 0.05
  trailing_callback_pct: 0.03

backtest:
  initial_capital: 10000.0   # 初始资金 (USDT)
  fee_rate: 0.0005           # 合约 Taker 手续费 (0.05%)
  slippage_pct: 0.0002       # 滑点 (0.02%)
  funding_rate: 0.0001       # 资金费率 每8小时 (0.01%)，4h K线=每2根收一次
  start_date: "2024-01-01"
  end_date: "2024-12-31"

strategy:
  name: ma_crossover          # 主策略：双均线交叉 + SMA200 趋势过滤
  params:
    # MA Crossover 参数（5年回测最优: 15/50 + SMA200过滤）
    fast_period: 15
    slow_period: 50
    trend_period: 200
    trend_filter: true
    # RSI 参数（保留以便快速切换策略）
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    # Bollinger Bands 参数（保留）
    bb_period: 30
    bb_std: 2.0

# =============================================
# 资金分配（多策略隔离，按总账户 USDT 百分比分配）
# 每个策略只用自己的额度，不会争用全局可用资金
# =============================================
allocation:
  bollinger_pct: 0.85    # 主策略（双均线趋势）85% —— 套利停用后转入
  funding_arb_pct: 0.0   # 费率套利已停用（Regular tier 手续费结构性不成立）
  grid_pct: 0.0          # 网格已停用（实测收益不佳）
  # 剩余 15% 作为缓冲（比之前 10% 更保守）

# =============================================
# 网格交易配置（已停用 - 真实回测显示长期收益接近 0）
# =============================================
# grid:
#   symbol: UNI/USDT:USDT
#   ...保留配置以便将来可能恢复，但 alloc grid_pct=0 已禁用

# =============================================
# 资金费率套利配置
# =============================================
funding_arb:
  symbols:                     # 套利标的（选费率高且流动性好的）
    - ETH/USDT:USDT
    - SOL/USDT:USDT
    - DOGE/USDT:USDT
  capital: 600.0               # 套利总资金 (USDT)
  per_symbol_pct: 0.25         # 每个标的占用资金比例 (25%)
  entry_rate: 0.0001           # 费率 ≥ 0.01% 时开仓（年化约 11%）
  exit_rate: 0.00005           # 费率 ≤ 0.005% 时平仓
  leverage: 1                  # 合约端杠杆（套利建议 1x）
  check_interval: 3600         # 检查间隔（秒），1小时

# =============================================
# 市场告警引擎配置（独立运行，不交易，仅推送提醒）
# =============================================
alert:
  check_interval: 1800       # 检查间隔（秒），30分钟
  warning_repeat_hours: 3    # WARNING 级别多久重复推送一次
  critical_repeat_hours: 6   # CRITICAL 级别多久重复推送一次
  daily_report_hour: 22      # 每日定时日报小时（UTC）

telegram:
  enabled: false              # 改成 true 开启通知
  bot_token: ""               # BotFather 给你的 token
  chat_id: ""                 # 你的 Telegram chat_id
  status_interval: 6          # 每 N 次tick播报一次状态（6=每24h）

logging:
  level: INFO
  file: logs/quant.log
